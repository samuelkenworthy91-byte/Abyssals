<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Abyssals — Civeton Opening</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f1115;
      color: #e8e6e1;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      /* Safe areas for notches, nav bar, status bar */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #app {
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1d24 0%, #0f1115 100%);
      /* Avoid stretching desktop canvas on mobile */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      max-width: 100%;
      max-height: 100%;
      /* Preserve intended presentation, don't simply stretch */
      object-fit: contain;
    }
    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* Safe areas */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #ui-root > * {
      pointer-events: auto;
    }
    /* Mobile responsive dialogue, battle, title, starter selection */
    @media (max-width: 600px) {
      #app {
        align-items: flex-start;
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
