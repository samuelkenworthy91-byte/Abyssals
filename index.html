<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abyssals — Civeton Opening</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f1115;
      color: #e8e6e1;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1d24 0%, #0f1115 100%);
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
    }
    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #ui-root > * {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
