name: Check pending patch without packaging
on:
  push:
    branches: ['patch/**', 'feature/**']
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/patch-checks.yml'
      - 'art-library/action-vfx/batch-*.json'
      - 'art-library/action-vfx/quality-reviews.json'
      - 'art-library/action-vfx/provenance.json'
      - 'art-library/action-vfx/atlas-detail-provenance.json'
      - 'art-library/finale/quality-reviews.json'
      - 'docs/move-coverage*'
      - 'docs/finale-environment-qa*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            tests
            docs
            art-library/reviews/item-branches-2026-10-26
            art-library/action-vfx
            art-library/finale
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inventory, save migration dependencies and map navigation
        run: |
          for file in dist/*.js; do node --check "$file"; done
          python3 -m pip install --quiet Pillow==11.1.0
          python3 scripts/audit-action-art.py
          node scripts/build-art-coverage.mjs --check
          node scripts/build-environment-qa.mjs --check
          python3 scripts/audit-finale-art.py
          node scripts/build-journal-habitats.mjs
          git diff --exit-code -- dist/journal-habitats.js
          for test in tests/*.test.mjs; do node "$test"; done
          node tests/bag-lift.test.mjs
          node tests/branches-berries.test.mjs
          node tests/waranwei-direction.test.mjs
          node tests/item-review.test.mjs
          node tests/marasen-navigation.test.mjs
          node tests/marasen-store.test.mjs
          node tests/expedition-choices.test.mjs
          node tests/status-capture.test.mjs
          python3 scripts/validate-game.py
      - name: Install browser for portrait interaction checks
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/abyssals-http.log 2>&1 &
      - name: Verify action artwork and live counter presentation
        run: |
          node tests/action-vfx-browser.cjs
          node tests/finale-art-browser.cjs
          node tests/tide-orchard-browser.cjs
          node tests/elite-leaders-browser.cjs
          node tests/finale-browser.cjs
      - name: Check every bag pocket and all six lift journeys
        run: node tests/bag-lift-browser.cjs
      - name: Check lift, Prodigy indicators and equipment on portrait phone
        run: node tests/fort-lift-prodigy-browser.cjs
      - name: Build and inspect the standalone item review
        run: |
          python3 art-library/reviews/item-branches-2026-10-26/build_review.py
          node tests/item-review-browser.cjs
      - name: Preserve phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-patch-phone-checks
          path: |
            build/qa
            build/review/*.html

  art-inventory:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.batches.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: art-library/action-vfx
      - id: batches
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const batches=fs.readdirSync('art-library/action-vfx').filter(f=>/^batch-\d+\.json$/.test(f)).map(f=>JSON.parse(fs.readFileSync('art-library/action-vfx/'+f)).batch).sort();
          console.log('batches='+JSON.stringify(batches));
          NODE
  action-batches:
    name: Live action artwork (batch ${{ matrix.batch }})
    needs: art-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.art-inventory.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            tests
            art-library/action-vfx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install chromium
      - name: Verify actual battles at phone size
        env:
          ART_BATCH: ${{ matrix.batch }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/abyssals-http.log 2>&1 &
          node tests/art-revision-browser.cjs
      - name: Preserve source-specific battle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-batch-${{ matrix.batch }}-phone-checks
          path: build/qa/action-review
