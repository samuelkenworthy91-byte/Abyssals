name: Leader school development checks (no APK)
on:
  push:
    branches:
      - feature/leader-school-overhaul
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /dist/*.js
            /dist/index.html
            /tests/*.test.mjs
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/leader-rosters.js
          node --check dist/leader-tactics.js
          node --check dist/field-journal.js
          node --check dist/field-journal-ui.js
      - name: Eight leader schools and advanced AI
        run: node tests/leader-schools.test.mjs
      - name: Journal observation and rumour privacy
        run: node tests/field-journal.test.mjs
