name: Build signed Android update
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release-config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            tests
            release
            docs
            art-library/reviews/item-branches-2026-10-26
            art-library/action-vfx
            art-library/finale
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game behavior and source
        run: |
          python3 -m pip install --quiet Pillow==11.1.0
          python3 scripts/audit-action-art.py
          node scripts/build-art-coverage.mjs --check
          node scripts/build-environment-qa.mjs --check
          python3 scripts/audit-finale-art.py
          node scripts/build-journal-habitats.mjs
          git diff --exit-code -- dist/journal-habitats.js
          node scripts/audit-shiny-art.mjs
          for test in tests/*.test.mjs; do node "$test"; done
          for file in dist/*.js; do node --check "$file"; done
          python3 scripts/validate-game.py
          python3 tests/android-manifest.test.py
      - name: Require complete reviewed artwork before release
        run: |
          node scripts/build-art-coverage.mjs --check --release
          node scripts/build-environment-qa.mjs --check --release
      - name: Install Chromium for interaction checks
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          # Hosted Ubuntu already has Chrome runtime libraries; avoid upgrading unrelated font/system packages.
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/abyssals-http.log 2>&1 &
      - name: Verify pixel action artwork on phone
        timeout-minutes: 3
        run: node tests/action-vfx-browser.cjs
      - name: Test Tide and Orchard moves, terrain and live battle graphics
        timeout-minutes: 4
        run: node tests/tide-orchard-browser.cjs
      - name: Test elite leaders, visible sightings and switching
        timeout-minutes: 5
        run: |
          node tests/elite-leaders-browser.cjs
          node tests/elite-offline-browser.cjs
      - name: Test redesigned sins, Fighting pivot and type eggs on phone
        timeout-minutes: 3
        run: node tests/pride-wrath-eggs-browser.cjs
      - name: Test berry pantry and new branch families on phone
        timeout-minutes: 3
        run: node tests/branches-berries-browser.cjs
      - name: Test Sunken Fort care on every floor
        timeout-minutes: 3
        run: node tests/fort-care-browser.cjs
      - name: Test fort lift, held bonuses, and Prodigy card indicators
        timeout-minutes: 3
        run: node tests/fort-lift-prodigy-browser.cjs
      - name: Test evolution renewal on phone
        timeout-minutes: 3
        run: node tests/evolution-renewal-browser.cjs
      - name: Test Rivet cores and sprites in Chromium
        timeout-minutes: 3
        run: node tests/rivet-armoury-browser.cjs
      - name: Test remaining real game interactions in Chromium
        timeout-minutes: 40
        run: |
          timeout 180s node tests/prodigy-evolution-browser.cjs
          timeout 300s node tests/nursery-care-browser.cjs
          timeout 240s node tests/egg-pouch-promenade-browser.cjs
          timeout 180s node tests/teamcraft-browser.cjs
          timeout 180s node tests/expedition-choices-browser.cjs
          timeout 180s node tests/field-quality-browser.cjs
          timeout 180s node tests/arena-bosses-browser.cjs
          timeout 180s node tests/training-rapids-browser.cjs
          timeout 180s node tests/character-art-browser.cjs
          timeout 180s node tests/shiny-browser.cjs
          timeout 180s node tests/quickbite-angling-browser.cjs
          timeout 180s node tests/browser-smoke.cjs
          timeout 180s node tests/botrune-browser.cjs
          timeout 180s node tests/finale-browser.cjs
          timeout 180s node tests/thunderplain-browser.cjs
          timeout 180s node tests/storm-polish-browser.cjs
          timeout 180s node tests/marasen-browser.cjs
      - name: Retain game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-visual-checks-${{ github.sha }}
          path: build/qa/
          if-no-files-found: ignore
      - name: Read release configuration
        id: config
        run: |
          python3 - <<'PY'
          import json,os,re
          c=json.load(open('release-config.json'))
          assert re.fullmatch(r'0\.\d{2}\.\d+',c['version'])
          assert isinstance(c['version_code'],int) and c['version_code']>102
          assert re.fullmatch(r'Abyssals-v[\w.\-]+\.apk',c['filename'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('version='+c['version']+'\ncode='+str(c['version_code'])+'\nfilename='+c['filename']+'\npwa='+c['pwa_filename']+'\n')
          PY
      - name: Recover compatible native wrapper
        run: python3 scripts/reconstruct-base.py
      - name: Build APK from committed game source
        run: python3 scripts/build-update.py --base build/Abyssals-v0.89.1-Marasen-Rebuilt.apk --version '${{ steps.config.outputs.version }}' --version-code '${{ steps.config.outputs.code }}' --output 'build/unsigned-${{ steps.config.outputs.version }}.apk'
      - name: Build verified offline PWA bundle
        run: python3 scripts/build-pwa.py
      - name: Retain unsigned build for signing recovery
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-${{ steps.config.outputs.version }}-${{ github.sha }}
          path: build/unsigned-${{ steps.config.outputs.version }}.apk
          retention-days: 7
      - name: Install Android signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apksigner zipalign
      - name: Sign and verify the update with the original release key
        env:
          ABYSSALS_KEYSTORE_BASE64: ${{ secrets.ABYSSALS_KEYSTORE_BASE64 }}
          ABYSSALS_STORE_PASSWORD: ${{ secrets.ABYSSALS_STORE_PASSWORD }}
          ABYSSALS_KEY_ALIAS: ${{ secrets.ABYSSALS_KEY_ALIAS }}
        run: python3 scripts/sign-update.py
      - name: Publish verified APK from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
          APK_FILENAME: ${{ steps.config.outputs.filename }}
          PWA_FILENAME: ${{ steps.config.outputs.pwa }}
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('release-config.json'))
          open('build/release-title.txt','w').write(c['title'])
          open('build/release-notes.md','w').write(c['notes']+'\n')
          PY
          gh release view "v$RELEASE_VERSION" >/dev/null 2>&1 || gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "$(cat build/release-title.txt)" --notes-file build/release-notes.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v$RELEASE_VERSION" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload "v$RELEASE_VERSION" "build/$APK_FILENAME" "build/$APK_FILENAME.sha256" "build/signature-verification-$RELEASE_VERSION.txt" "build/$PWA_FILENAME" "build/$PWA_FILENAME.sha256" --clobber




  pwa:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dist
          sparse-checkout-cone-mode: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload tested PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy tested PWA
        id: deployment
        uses: actions/deploy-pages@v4

