name: Build signed Android update
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release-config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browser-groups: ${{ steps.inventory.outputs.browser-groups }}
      batches: ${{ steps.inventory.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            dist
            scripts
            tests
            release
            docs
            art-library/reviews/item-branches-2026-10-26
            art-library/action-vfx
            art-library/finale
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game, saves, graphics and declared release scope
        run: |
          python3 -m pip install --quiet Pillow==11.1.0
          python3 scripts/audit-action-art.py
          node scripts/build-art-coverage.mjs --check
          node scripts/build-environment-qa.mjs --check
          python3 scripts/verify-art-release-scope.py
          python3 tests/interim-art-scope.test.py
          python3 scripts/audit-finale-art.py
          node scripts/build-journal-habitats.mjs
          git diff --exit-code -- dist/journal-habitats.js
          node scripts/audit-shiny-art.mjs
          for test in tests/*.test.mjs; do node "$test"; done
          for file in dist/*.js; do node --check "$file"; done
          python3 scripts/validate-game.py
          python3 tests/android-manifest.test.py
      - name: Discover all browser suites and animation batches
        id: inventory
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const files=fs.readdirSync('tests').filter(f=>f.endsWith('-browser.cjs')||f==='browser-smoke.cjs').filter(f=>f!=='art-revision-browser.cjs').sort();
          const groups=Array.from({length:6},(_,i)=>({name:'group-'+(i+1),tests:files.filter((_,n)=>n%6===i).map(f=>'tests/'+f)})).filter(g=>g.tests.length);
          const batches=fs.readdirSync('art-library/action-vfx').filter(f=>/^batch-\d+\.json$/.test(f)).map(f=>JSON.parse(fs.readFileSync('art-library/action-vfx/'+f)).batch).sort();
          console.log('browser-groups='+JSON.stringify(groups));
          console.log('batches='+JSON.stringify(batches));
          NODE
  browsers:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.browser-groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            tests
            art-library/reviews/item-branches-2026-10-26
            art-library/action-vfx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}
      - name: Prepare Chromium and game server
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/abyssals-http.log 2>&1 &
      - name: Verify real game interactions
        env:
          TEST_FILES: ${{ toJSON(matrix.tests) }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const files=JSON.parse(process.env.TEST_FILES);
          if(files.includes('tests/item-review-browser.cjs')){const r=spawnSync('python3',['art-library/reviews/item-branches-2026-10-26/build_review.py'],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1);}
          for(const file of files){console.log('VERIFY '+file);const r=spawnSync('timeout',['300s','node',file],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1);}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-${{ matrix.name }}
          path: build/qa/
          if-no-files-found: ignore
  action-batches:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.validate.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dist/
            /tests/
            /art-library/action-vfx/batch-*.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}
      - name: Verify every authored batch in actual battles
        env:
          ART_BATCH: ${{ matrix.batch }}
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/abyssals-http.log 2>&1 &
          node tests/art-revision-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-actions-${{ matrix.batch }}
          path: build/qa/action-review/
          if-no-files-found: ignore
  release:
    needs: [validate, browsers, action-batches]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            release
      - name: Build from the fully verified commit
        run: echo "All source and browser checks passed for $GITHUB_SHA"
      - name: Read release configuration
        id: config
        run: |
          python3 - <<'PY'
          import json,os,re
          c=json.load(open('release-config.json'))
          assert re.fullmatch(r'0\.\d{2}\.\d+',c['version'])
          assert isinstance(c['version_code'],int) and c['version_code']>102
          assert re.fullmatch(r'Abyssals-v[\w.\-]+\.apk',c['filename'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('version='+c['version']+'\ncode='+str(c['version_code'])+'\nfilename='+c['filename']+'\npwa='+c['pwa_filename']+'\n')
          PY
      - name: Recover compatible native wrapper
        run: python3 scripts/reconstruct-base.py
      - name: Build APK from committed game source
        run: python3 scripts/build-update.py --base build/Abyssals-v0.89.1-Marasen-Rebuilt.apk --version '${{ steps.config.outputs.version }}' --version-code '${{ steps.config.outputs.code }}' --output 'build/unsigned-${{ steps.config.outputs.version }}.apk'
      - name: Build verified offline PWA bundle
        run: python3 scripts/build-pwa.py
      - name: Retain unsigned build for signing recovery
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-${{ steps.config.outputs.version }}-${{ github.sha }}
          path: build/unsigned-${{ steps.config.outputs.version }}.apk
          retention-days: 7
      - name: Install Android signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apksigner zipalign
      - name: Sign and verify the update with the original release key
        env:
          ABYSSALS_KEYSTORE_BASE64: ${{ secrets.ABYSSALS_KEYSTORE_BASE64 }}
          ABYSSALS_STORE_PASSWORD: ${{ secrets.ABYSSALS_STORE_PASSWORD }}
          ABYSSALS_KEY_ALIAS: ${{ secrets.ABYSSALS_KEY_ALIAS }}
        run: python3 scripts/sign-update.py
      - name: Retain signing and package verification
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ steps.config.outputs.version }}
          path: |
            build/*.sha256
            build/signature-verification-*.txt
          if-no-files-found: error
      - name: Publish verified APK from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
          APK_FILENAME: ${{ steps.config.outputs.filename }}
          PWA_FILENAME: ${{ steps.config.outputs.pwa }}
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('release-config.json'))
          open('build/release-title.txt','w').write(c['title'])
          open('build/release-notes.md','w').write(c['notes']+'\n')
          PY
          gh release view "v$RELEASE_VERSION" >/dev/null 2>&1 || gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "$(cat build/release-title.txt)" --notes-file build/release-notes.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v$RELEASE_VERSION" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload "v$RELEASE_VERSION" "build/$APK_FILENAME" "build/$APK_FILENAME.sha256" "build/signature-verification-$RELEASE_VERSION.txt" "build/$PWA_FILENAME" "build/$PWA_FILENAME.sha256" --clobber

  pwa:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dist
          sparse-checkout-cone-mode: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload tested PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy tested PWA
        id: deployment
        uses: actions/deploy-pages@v4


