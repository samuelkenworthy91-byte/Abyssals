name: Development workspace snapshot
on:
  push:
    branches: ['feature/v0.90.51-bespoke-moves-batch-01']
    paths: ['.github/workflows/development-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            tests
            docs
            art-library/action-vfx
            art-library/finale
            art-library/reviews/item-branches-2026-10-26
      - name: Package current development assets
        run: tar -czf development-workspace.tar.gz dist scripts tests docs art-library AGENTS.md release-config.json .github
      - uses: actions/upload-artifact@v4
        with:
          name: development-workspace
          path: development-workspace.tar.gz
          retention-days: 1
