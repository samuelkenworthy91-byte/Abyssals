<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyssals · The Common Cause</title><style>body{margin:0;background:#182625;color:#f4eddc;font:16px/1.5 system-ui}main,header{max-width:1100px;margin:auto;padding:24px}a{color:#e9ca8c}article{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:24px;padding:24px;margin:18px 0;background:#263a34;border:1px solid #728277;border-radius:9px}.portrait{width:100%;height:370px;object-fit:contain}.walks{display:flex;gap:12px;flex-wrap:wrap}.walk{width:96px;height:96px;background-size:384px 384px;background-position-y:calc(var(--row)*-96px);animation:stride .8s steps(4) infinite}.walks figure{margin:0;text-align:center}.sheet{width:100%;max-width:400px}h1,h2{font-family:Georgia,serif}small{color:#d8d1bd}@keyframes stride{to{background-position-x:-384px}}@media(max-width:650px){article{grid-template-columns:1fr}.portrait{height:300px}}@media(prefers-reduced-motion:reduce){.walk{animation:none}}</style></head><body><header><a href="./">Return to Abyssals</a><h1>The Common Cause</h1><p>Peasants from both sides of the war. Five distinct character designs, each with a portrait and four-direction walking artwork.</p></header><main id="cast"></main><script type="module">import {REVOLT_CAST} from './revolt-data.js?v=0.90.48';document.querySelector('#cast').innerHTML=Object.entries(REVOLT_CAST).map(([id,c])=>`<article><img class="portrait" src="assets/${id}.webp" alt="${c.name} portrait"><div><h2>${c.name}</h2><p>${c.origin} · ${c.role}</p><div class="walks">${['Down','Left','Up','Right'].map((d,i)=>`<figure><div class="walk" style="--row:${i};background-image:url('assets/walk/${id}.webp')" role="img" aria-label="${c.name} walking ${d.toLowerCase()}"></div><small>${d}</small></figure>`).join('')}</div><details><summary>Full walking sheet</summary><img class="sheet" src="assets/walk/${id}.webp" alt="${c.name} walking atlas"></details></div></article>`).join('');</script></body></html>
